<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قصر الأميرات - نظام الحجز الإلكتروني</title>
    <!-- استدعاء خط عربي أنيق -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* CSS Variables & Global Styles */
        :root {
            --primary-gold: #d4af37;
            --dark-gold: #aa7c11;
            --bg-dark: #0f1117;
            --card-bg: #1a1d24;
            --text-light: #f8f9fa;
            --text-muted: #a0a5b5;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --border-color: rgba(212, 175, 55, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding-bottom: 50px;
            overflow-x: hidden;
        }

        /* Header Styles */
        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(180deg, rgba(212, 175, 55, 0.15) 0%, rgba(15, 17, 23, 0) 100%);
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 900;
            color: var(--primary-gold);
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Container & Grid Layout */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .instructions {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 12px;
            border-right: 4px solid var(--primary-gold);
            margin-bottom: 30px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-around;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }

        .legend-color {
            width: 18px;
            height: 18px;
            border-radius: 4px;
        }

        .legend-available { background-color: #2a2e3d; border: 1px solid var(--border-color); }
        .legend-selected { background-color: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }
        .legend-booked { background-color: var(--accent-red); opacity: 0.8; }

        /* Apartments Section */
        .apartments-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .apartment-card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .apartment-card:hover {
            border-color: var(--primary-gold);
            transform: translateY(-5px);
        }

        .apartment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .apartment-title {
            font-size: 1.3rem;
            color: var(--primary-gold);
            font-weight: 700;
        }

        .floor-badge {
            background: rgba(212, 175, 55, 0.15);
            color: var(--primary-gold);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        /* Room & Beds Layout */
        .room-section {
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .room-title {
            font-size: 0.95rem;
            color: var(--text-light);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            font-weight: 600;
        }

        .room-tag {
            font-size: 0.75rem;
            color: var(--primary-gold);
            background: rgba(212, 175, 55, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .beds-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* Bed Button Touch & Click Effects */
        .bed-btn {
            flex: 1;
            min-width: 70px;
            padding: 10px 5px;
            background: #2a2e3d;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-light);
            cursor: pointer;
            text-align: center;
            font-size: 0.85rem;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            position: relative;
            overflow: hidden;
        }

        /* Active Effect on Touch */
        .bed-btn:active {
            transform: scale(0.92);
        }

        .bed-btn.selected {
            background: var(--accent-green);
            color: #fff;
            border-color: var(--accent-green);
            box-shadow: 0 0 12px rgba(46, 204, 113, 0.5);
            font-weight: bold;
        }

        .bed-btn.booked {
            background: var(--accent-red);
            color: #fff;
            border-color: var(--accent-red);
            opacity: 0.7;
            cursor: not-allowed;
            text-decoration: line-through;
        }

        .bed-btn.booked::after {
            content: " (تم بالحجز)";
            font-size: 0.65rem;
            display: block;
        }

        /* Ripple Animation on Touch */
        .ripple {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-effect 0.5s linear;
            pointer-events: none;
        }

        @keyframes ripple-effect {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Booking Form Summary Panel */
        .booking-summary {
            margin-top: 40px;
            background: var(--card-bg);
            border: 1px solid var(--primary-gold);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .booking-summary h2 {
            color: var(--primary-gold);
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #12141a;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: var(--primary-gold);
        }

        .selected-list {
            background: #12141a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            min-height: 45px;
            font-size: 0.9rem;
            color: var(--primary-gold);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary-gold) 0%, var(--dark-gold) 100%);
            border: none;
            border-radius: 8px;
            color: #000;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        .submit-btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Responsive */
        @media (max-width: 600px) {
            header h1 { font-size: 2rem; }
            .apartments-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>🏰 قصر الأميرات</h1>
        <p>نظام الحجز الإلكتروني الفاخر للسكن</p>
    </header>

    <div class="container">
        
        <!-- Legend Section -->
        <div class="instructions">
            <div class="legend-item">
                <div class="legend-color legend-available"></div>
                <span>متاح للحجز</span>
            </div>
            <div class="legend-item">
                <div class="legend-color legend-selected"></div>
                <span>تم اختياره (محدد)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color legend-booked"></div>
                <span>تم حجزه متطلباً</span>
            </div>
        </div>

        <!-- Building Apartments Container -->
        <div class="apartments-grid" id="apartmentsGrid">
            <!-- Dynamic Content Generated by JavaScript -->
        </div>

        <!-- Checkout / Reservation Form -->
        <div class="booking-summary" id="bookingFormSection">
            <h2>إتمام حجز السراير</h2>
            <form id="bookingForm">
                <div class="form-group">
                    <label>السراير المختارة:</label>
                    <div class="selected-list" id="selectedBedsList">لم تقم باختيار أي سرير بعد. اضغط على السراير أعلاه لاختيارها.</div>
                </div>
                <div class="form-group">
                    <label for="userName">اسم الحاجز بالكامل:</label>
                    <input type="text" id="userName" placeholder="أدخل اسمك الكريم" required>
                </div>
                <div class="form-group">
                    <label for="userPhone">رقم الهاتف / الواتساب:</label>
                    <input type="tel" id="userPhone" placeholder="01xxxxxxxxx" required>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn" disabled>تأكيد الحجز الآن</button>
            </form>
        </div>

    </div>

    <!-- JavaScript -->
    <script>
        // Array to store selected bed IDs
        let selectedBeds = [];

        // Example: List of pre-booked beds (can be changed or dynamically updated)
        const bookedBeds = ['apt-1-bed-1', 'apt-3-bed-5']; // مثال: سرير محجوز سابقاً

        // Generate Building Structure dynamically
        function initBuilding() {
            const grid = document.getElementById('apartmentsGrid');
            grid.innerHTML = '';

            // 8 Floors / 8 Apartments
            for (let i = 1; i <= 8; i++) {
                const aptCard = document.createElement('div');
                aptCard.className = 'apartment-card';
                
                aptCard.innerHTML = `
                    <div class="apartment-header">
                        <span class="apartment-title">شقة رقم ${i}</span>
                        <span class="floor-badge">الدور ${i}</span>
                    </div>

                    <!-- Room 1: 2 Beds (Balcony) -->
                    <div class="room-section">
                        <div class="room-title">
                            <span>غرفة 1</span>
                            <span class="room-tag">بلكونة</span>
                        </div>
                        <div class="beds-container">
                            ${createBedButton(i, 1, 'سرير 1')}
                            ${createBedButton(i, 2, 'سرير 2')}
                        </div>
                    </div>

                    <!-- Room 2: 2 Beds (Window) -->
                    <div class="room-section">
                        <div class="room-title">
                            <span>غرفة 2</span>
                            <span class="room-tag">شباك</span>
                        </div>
                        <div class="beds-container">
                            ${createBedButton(i, 3, 'سرير 3')}
                            ${createBedButton(i, 4, 'سرير 4')}
                        </div>
                    </div>

                    <!-- Room 3: 3 Beds (Inner Balcony) -->
                    <div class="room-section">
                        <div class="room-title">
                            <span>غرفة 3</span>
                            <span class="room-tag">بلكونة داخلية</span>
                        </div>
                        <div class="beds-container">
                            ${createBedButton(i, 5, 'سرير 5')}
                            ${createBedButton(i, 6, 'سرير 6')}
                            ${createBedButton(i, 7, 'سرير 7')}
                        </div>
                    </div>
                `;
                grid.appendChild(aptCard);
            }

            attachBedEvents();
        }

        // Helper to generate bed HTML button
        function createBedButton(aptNum, bedNum, label) {
            const bedId = `apt-${aptNum}-bed-${bedNum}`;
            const isBooked = bookedBeds.includes(bedId);
            const statusClass = isBooked ? 'booked' : '';
            
            return `
                <button type="button" 
                        class="bed-btn ${statusClass}" 
                        data-id="${bedId}" 
                        data-apt="${aptNum}" 
                        data-label="${label}"
                        ${isBooked ? 'disabled' : ''}>
                    🛏️ ${label}
                </button>
            `;
        }

        // Attach touch/click events & animations
        function attachBedEvents() {
            const bedBtns = document.querySelectorAll('.bed-btn:not(.booked)');

            bedBtns.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    // Create Touch Ripple Effect
                    createRipple(e, this);

                    const bedId = this.getAttribute('data-id');

                    // Toggle selection
                    if (selectedBeds.includes(bedId)) {
                        selectedBeds = selectedBeds.filter(id => id !== bedId);
                        this.classList.remove('selected');
                    } else {
                        selectedBeds.push(bedId);
                        this.classList.add('selected');
                    }

                    updateSummary();
                });
            });
        }

        // Touch Ripple Effect function
        function createRipple(event, element) {
            const circle = document.createElement('span');
            const diameter = Math.max(element.clientWidth, element.clientHeight);
            const radius = diameter / 2;

            const rect = element.getBoundingClientRect();
            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${event.clientX - rect.left - radius}px`;
            circle.style.top = `${event.clientY - rect.top - radius}px`;
            circle.classList.add('ripple');

            const ripple = element.getElementsByClassName('ripple')[0];
            if (ripple) {
                ripple.remove();
            }

            element.appendChild(circle);
        }

        // Update booking summary UI
        function updateSummary() {
            const summaryDiv = document.getElementById('selectedBedsList');
            const submitBtn = document.getElementById('submitBtn');

            if (selectedBeds.length === 0) {
                summaryDiv.innerHTML = 'لم تقم باختيار أي سرير بعد. اضغط على السراير أعلاه لاختيارها.';
                submitBtn.disabled = true;
            } else {
                let textArray = selectedBeds.map(id => {
                    const btn = document.querySelector(`[data-id="${id}"]`);
                    const apt = btn.getAttribute('data-apt');
                    const label = btn.getAttribute('data-label');
                    return `شقة ${apt} - ${label}`;
                });

                summaryDiv.innerHTML = `<strong>عدد السراير المختارة (${selectedBeds.length}):</strong> <br>` + textArray.join(' | ');
                submitBtn.disabled = false;
            }
        }

        // Form Submit Handler
        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();

            if (selectedBeds.length === 0) return;

            const name = document.getElementById('userName').value;
            const phone = document.getElementById('userPhone').value;

            // Mark selected beds as PERMANENTLY BOOKED for this session
            selectedBeds.forEach(bedId => {
                bookedBeds.push(bedId);
                const btn = document.querySelector(`[data-id="${bedId}"]`);
                if (btn) {
                    btn.classList.remove('selected');
                    btn.classList.add('booked');
                    btn.disabled = true;
                }
            });

            alert(`شكراً لك يا ${name}! \nتم تأكيد حجز عدد (${selectedBeds.length}) سرير بنجاح باسم: ${name}.\nرقم التواصل: ${phone}`);

            // Reset form & selections
            selectedBeds = [];
            document.getElementById('bookingForm').reset();
            updateSummary();
        });

        // Initialize App
        initBuilding();
    </script>
</body>
</html>
